version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Inherited from the shared platform, not declared here. CodeQL no longer caps it
      # (github/codeql#21938 closed 2026-07-08), but CVE-2026-53914 is fixed in Kotlin 2.4.20,
      # which has no GA release, and ktlint 1.5.0 cannot run under 2.4.10. Bumped in
      # build-conventions when both land.
      - dependency-name: "org.jetbrains.kotlin.jvm"
      # settings.gradle maps these plugin ids to com.github.damian1000.build-conventions:plugins
      # through an eachPlugin resolutionStrategy. Dependabot does not run that mapping, so it
      # asks JitPack for the plugin-marker coordinate io/github/damian1000/... which does not
      # exist there; JitPack answers 401 for an unknown group and Dependabot reports
      # private_source_authentication_failure. No credential fixes a coordinate that is not
      # published — platform bumps are a deliberate estate-wide sweep. Matched by prefix so
      # that a repository applying a different convention plugin cannot silently miss the entry.
      - dependency-name: "io.github.damian1000.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
