name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; never cancel a release mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    uses: damianhoward/.github/.github/workflows/deploy.yml@main
    with:
      app: trading-system
      url: https://trading.damianhoward.com
      health-port: "8082"
      # Longer than the shared default, and longer than the 30s coherence grace in Readiness:
      # /readyz is 503 while the positions and limits views disagree, so a deploy must not be
      # able to go green by probing in the seconds before the first coherence halt. This is the
      # gate the 2026-07-19 ORA-12838 incident argued for.
      hold-seconds: 30
    secrets: inherit
