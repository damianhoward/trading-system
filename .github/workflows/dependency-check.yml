name: Dependency check

# OWASP dependency-check against the shared reusable workflow. Not part of CI: the scan reports
# advisories published since the last build rather than anything about a diff, which dep-review
# already gates. Monday and Thursday rather than weekly: GitHub evicts a cache unused for seven
# days, so a seven-day schedule left the NVD copy expiring exactly as the next run needed it and
# every repository re-downloaded the whole feed from cold. The time is this repository's slot in
# the estate-wide stagger recorded in workspace-config document 07 — thirteen repositories share
# one NVD API key, and starting them together throttles every cold scan. Slots sit twenty minutes
# apart because GitHub delays scheduled runs by minutes under load, which a tighter spread would
# not survive.
on:
  schedule:
    - cron: "43 9 * * 1,4"
  workflow_dispatch:

jobs:
  scan:
    uses: damianhoward/.github/.github/workflows/dependency-check.yml@main
    secrets: inherit
